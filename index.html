<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러브러브</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Screen 1: Login -->
    <div id="screen1" class="screen">
        <div class="login-box">
            <div class="icon">💖</div>
            <h1>러브러브</h1>
            <p>비밀 유지를 위해 로그인하세요.</p>
            <input type="text" id="userName" placeholder="이름 (본인 이름)">
            <input type="password" id="dummyPassword" placeholder="비밀번호 (6자 이상)">
            <button id="loginBtn">로그인</button>
        </div>
    </div>

    <!-- Screen Mode: Select Mode -->
    <div id="screenMode" class="screen" style="display: none;">
        <div class="login-box">
            <div class="icon">🎮</div>
            <h2>모드를 선택하세요</h2>
            <button id="modeSurveyBtn">나의 대한 생각</button>
            <button id="modeQuizBtn">개발자(문주왕)에 대한 퀴즈</button>
            <br>
            <button id="secretBtnMode" class="secret-btn">????</button>
        </div>
    </div>

    <!-- Screen 2: Survey (Step-by-step) -->
    <div id="screen2" class="screen" style="display: none;">
        <div class="login-box" style="width: 90%; max-width: 400px;">
            <div class="icon">📝</div>
            <h2 id="surveyTitle">질문</h2>
            <input type="text" id="surveyInput" placeholder="답변을 입력하세요">
            <button id="nextSurveyBtn">다음</button>
        </div>
    </div>

    <!-- Screen 3: Share (Survey Complete) -->
    <div id="screen3" class="screen" style="display: none;">
        <div class="login-box">
            <h2>반에서 가장 조용한 친구에게 공유해주세요!</h2>
            <p>친구에게 링크를 전달해서 마음을 테스트해보세요.</p>
            <button id="secretBtn" class="secret-btn">????</button>
        </div>
    </div>

    <!-- Screen Quiz: Quiz Step-by-step -->
    <div id="screenQuiz" class="screen" style="display: none;">
        <div class="login-box" style="width: 90%; max-width: 400px;">
            <div class="icon">🤔</div>
            <div id="livesDisplay" style="color: #ffb6c1; margin-bottom: 10px; font-weight: bold;">남은 목숨: ❤️❤️❤️</div>
            <h2 id="quizTitle">질문</h2>
            <input type="text" id="quizInput" placeholder="정답을 입력하세요">
            <button id="nextQuizBtn">다음</button>
        </div>
    </div>

    <!-- Screen Quiz Fail -->
    <div id="screenQuizFail" class="screen" style="display: none;">
        <div class="login-box">
            <div class="icon">❌</div>
            <h2>다시!</h2>
            <p>틀린 문제가 있습니다.</p>
            <button id="retryQuizBtn">다시 도전하기</button>
        </div>
    </div>

    <!-- Screen Quiz Success -->
    <div id="screenQuizSuccess" class="screen" style="display: none;">
        <div class="login-box">
            <div class="icon">🎉</div>
            <h2>정답입니다!</h2>
            <p>문주왕에 대해 아주 잘 알고 계시군요!</p>
            <button id="secretBtnQuiz" class="secret-btn">????</button>
        </div>
    </div>

    <!-- Screen 4: Admin (Result) -->
    <div id="screen4" class="screen" style="display: none;">
        <div class="login-box result-box" style="width: 90%; max-width: 500px;">
            <h2>비밀 목록 🤫</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button id="tabSurvey" style="background-color: #e74c3c;">설문 결과</button>
                <button id="tabQuiz" style="background-color: #3498db;">퀴즈 결과</button>
            </div>
            <ul id="resultList"></ul>
            <button id="backBtn">처음으로</button>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
