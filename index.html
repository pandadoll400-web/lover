<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>달걀 도둑 3D - 펫 키우기 스피드런</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
                <div id="stats">
            <h2>💰 코인: <span id="coinCount">0</span></h2>
            <h2>💸 초당 수입: <span id="coinRate">0</span>/s</h2>
            <hr>
            <h2>⚡ 스피드 레벨: <span id="speedLevel">1</span></h2>
            <div id="xpBarContainer">
                <div id="xpBar"></div>
            </div>
            <p id="xpText">0 / 36,000 경험치</p>
            <div id="alertBox"></div>
        </div>

        <button id="btnPetMenu">🐶 펫 보관함</button>

        <!-- 로블록스 스타일 핫바 (인벤토리) -->
        <div id="hotbar">
            <div class="slot active" id="slot1"><span class="key">1</span><div class="item"></div></div>
            <div class="slot" id="slot2"><span class="key">2</span><div class="item"></div></div>
            <div class="slot" id="slot3"><span class="key">3</span><div class="item"></div></div>
            <div class="slot" id="slot4"><span class="key">4</span><div class="item"></div></div>
            <div class="slot" id="slot5"><span class="key">5</span><div class="item"></div></div>
        </div>

        <div id="interactionPrompt" style="display: none; position:absolute; bottom:100px; left:50%; transform:translateX(-50%); font-size:24px; font-weight:bold; color:white; text-shadow:2px 2px 4px black; z-index:10;">[E] 상호작용</div>
        
        <div id="shopUi" style="display: none; padding:20px; text-align:center; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); border-radius:10px; z-index:1000; width:400px; color:white;">
    <h2>상점 - 런닝머신</h2>
    <p style="margin-bottom:20px; font-size:14px; color:#ddd;">자동 스피드 경험치 획득 장치를 업그레이드하세요!</p>
    
    <div style="margin-bottom:20px; padding:15px; background:rgba(255,255,255,0.1); border-radius:10px; text-align:left;">
        <div id="shopTreadmillName" style="font-size:22px; font-weight:bold; color:gold; margin-bottom:10px;">나무 런닝머신</div>
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>현재 등급:</span>
            <span id="shopCurrentTier">없음</span>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>경험치 배율:</span>
            <span id="shopMultiplier">1x</span>
        </div>
        <div style="display:flex; justify-content:space-between; color:#ffdd44; font-weight:bold;">
            <span>업그레이드 비용:</span>
            <span id="shopCost">50 코인</span>
        </div>
    </div>

    <button id="btnBuyTreadmill" style="width:100%; padding:15px; font-size:18px; font-weight:bold; background:gold; border:none; border-radius:10px; cursor:pointer; color:#000; margin-bottom:10px;">런닝머신 구매/강화</button>
    <button id="btnCloseShop" style="width:100%; background:#555; color:white; border:none; padding:10px; border-radius:5px; cursor:pointer;">닫기</button>
</div>
        </div>

        
    <div id="treadmillStatus" style="position:absolute; right:20px; bottom:20px; z-index:10;">
        
        <div id="treadmillHint" style="display: none; font-size:18px; font-weight:bold; color:white; text-shadow:1px 1px 2px black;">[E] 타기/내리기</div>
    </div>
<div id="trainingUi" style="display: none; position:absolute; bottom:150px; left:50%; transform:translateX(-50%); text-align:center; color:white; text-shadow:2px 2px 4px black; z-index:10;">
    <h1 style="font-size:36px; margin:0; color:gold;">훈련 중!</h1>
    <p style="font-size:18px; margin:5px 0;">이동 키(W,A,S,D)를 눌러 경험치를 올리세요!</p>
    <p id="trainingXp" style="font-size:24px; font-weight:bold; color:#00ff00; margin:0;">+0 경험치</p>
</div>
        
        <div id="crosshair"></div>
        
        <!-- 펫 플로팅 라벨 컨테이너 -->
        <div id="petLabelsContainer"></div>
    </div>
    
    <!-- 펫 장착 모달 -->
    <div id="petModal" style="display: none;">
        <div class="modal-content">
            <h2>🐶 펫 보관함</h2>
            <button id="btnEquipBest" class="btn-primary">✨ 최고 등급 장착</button>
            <button id="btnClosePet" class="btn-secondary">닫기</button>
            <div id="petList"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
