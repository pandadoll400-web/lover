<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>러브러브 X 스플래툰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Screen 1: Login -->
    <div id="screen1" class="screen">
        <div class="login-box">
            <div class="icon" id="mainIcon" style="cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: center; gap: 15px;">
                <div style="font-size: 50px; line-height: 1;">💖</div>
                <div style="font-size: 24px; font-weight: bold; color: #555;">X</div>
                <img src="icon.png" alt="Icon" style="width: 70px; height: 70px; border-radius: 15px; display: block;">
            </div>
            <h1 id="mainTitle">러브러브 X 스플래툰</h1>
            <p>비밀 유지를 위해 로그인하세요.</p>
            <input type="text" id="userName" placeholder="이름 (본인 이름)">
            <input type="password" id="dummyPassword" placeholder="비밀번호 (6자 이상)">
            <button id="loginBtn">로그인</button>
            <button id="modeCollabBtn" style="background-color: #27ae60; margin-top: 10px;">내 짝을 찾아서 (콜라보 모드)</button>
        </div>
    </div>

    <!-- Screen Mode: Select Mode -->
    <div id="screenMode" class="screen" style="display: none;">
        <div class="login-box">
            <div class="icon" id="secretIconMode" style="cursor: pointer;">🎮</div>
            <h2>모드를 선택하세요</h2>
            <button id="modeSurveyBtn">나의 대한 생각</button>
            <button id="modeQuizBtn">개발자(문주왕)에 대한 퀴즈</button>
            <button id="modeHateBtn" style="display: none; background-color: #8e44ad;">Hate 모드</button>
        </div>
    </div>

    <!-- Screen 2: Survey (Step-by-step) -->
    <div id="screen2" class="screen" style="display: none;">
        <div class="login-box" style="width: 90%; max-width: 400px;">
            <div class="icon">📝</div>
            <h2 id="surveyTitle">질문</h2>
            <input type="text" id="surveyInput" placeholder="답변을 입력하세요">
            <button id="nextSurveyBtn">다음</button>
        </div>
    </div>

    <!-- Screen 3: Share (Survey Complete) -->
    <div id="screen3" class="screen" style="display: none;">
        <div class="login-box">
            <h2>반에서 가장 조용한 친구에게 공유해주세요!</h2>
            <p>친구에게 링크를 전달해서 마음을 테스트해보세요.</p>
        </div>
    </div>

    <!-- Screen Quiz: Quiz Step-by-step -->
    <div id="screenQuiz" class="screen" style="display: none;">
        <div class="login-box" style="width: 90%; max-width: 400px;">
            <div class="icon">🤔</div>
            <div id="livesDisplay" style="color: #ffb6c1; margin-bottom: 10px; font-weight: bold;">남은 목숨: ❤️❤️❤️</div>
            <h2 id="quizTitle">질문</h2>
            <input type="text" id="quizInput" placeholder="정답을 입력하세요">
            <button id="nextQuizBtn">다음</button>
        </div>
    </div>

    <!-- Screen Quiz Fail -->
    <div id="screenQuizFail" class="screen" style="display: none;">
        <div class="login-box">
            <div class="icon">❌</div>
            <h2>다시!</h2>
            <p>틀린 문제가 있습니다.</p>
            <button id="retryQuizBtn">다시 도전하기</button>
        </div>
    </div>

    <!-- Screen Quiz Success -->
    <div id="screenQuizSuccess" class="screen" style="display: none;">
        <div class="login-box">
            <div class="icon">🎉</div>
            <h2>정답입니다!</h2>
            <p>문주왕에 대해 아주 잘 알고 계시군요!</p>
        </div>
    </div>

    <!-- Screen Hate: Enter disliked friends -->
    <div id="screenHate" class="screen" style="display: none;">
        <div class="login-box" style="width: 90%; max-width: 400px; border-color: #8e44ad;">
            <div class="icon">😈</div>
            <h2>비밀스럽게 알려주세요...</h2>
            <input type="text" id="hateOpposite" placeholder="반에서 싫어하는 이성 친구">
            <input type="text" id="hateSame" placeholder="반에서 싫어하는 동성 친구">
            <button id="submitHateBtn" style="background-color: #8e44ad;">확인</button>
        </div>
    </div>

    <!-- Screen Collab: Survey -->
    <div id="screenCollab" class="screen" style="display: none;">
        <div class="login-box" style="width: 90%; max-width: 400px; border-color: #27ae60;">
            <div class="icon">🎨</div>
            <h2 id="collabTitle">질문</h2>
            <input type="text" id="collabInput" placeholder="답변을 입력하세요">
            <button id="nextCollabBtn" style="background-color: #27ae60;">다음</button>
        </div>
    </div>

    <!-- Screen Collab Result -->
    <div id="screenCollabResult" class="screen" style="display: none;">
        <div class="login-box" style="border-color: #27ae60;">
            <div class="icon">✅</div>
            <h2>완료</h2>
            <p id="collabMatchInfo" style="font-size: 18px; font-weight: bold; color: #27ae60;">확인 중...</p>
            <button id="collabHomeBtn" style="background-color: #27ae60; margin-top: 15px;">처음으로</button>
        </div>
    </div>

    <!-- Screen 4: Admin (Result) -->
    <div id="screen4" class="screen" style="display: none;">
        <div class="login-box result-box" style="width: 90%; max-width: 500px;">
            <h2>비밀 목록 🤫</h2>
            <div style="display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap;">
                <button id="tabSurvey" style="background-color: #e74c3c; flex: 1; padding: 10px; font-size: 12px; min-width: 80px;">설문 결과</button>
                <button id="tabQuiz" style="background-color: #3498db; flex: 1; padding: 10px; font-size: 12px; min-width: 80px;">퀴즈 결과</button>
                <button id="tabHate" style="background-color: #8e44ad; flex: 1; padding: 10px; font-size: 12px; min-width: 80px;">헤잇 결과</button>
                <button id="tabCollab" style="background-color: #27ae60; flex: 1; padding: 10px; font-size: 12px; min-width: 80px;">콜라보</button>
            </div>
            <ul id="resultList"></ul>
            <button id="backBtn">처음으로</button>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
